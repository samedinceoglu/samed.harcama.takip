<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Gelir &amp; Gider Takip</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#111827;--muted:#64748b;--line:#e2e8f0;--navy:#0f172a;--accent:#c89b3c;--danger:#b91c1c;--shadow:0 12px 32px rgba(15,23,42,.08);--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.97);color:#fff;box-shadow:0 5px 24px rgba(15,23,42,.18)}.topbar-inner{max-width:1280px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:14px;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-weight:800}.brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#d6b15c,#a7741f);display:grid;place-items:center;color:#111827;font-weight:900}.status{display:flex;align-items:center;gap:8px;font-size:13px;color:#cbd5e1}.status-dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
.main{max-width:1280px;margin:0 auto;padding:22px 20px 60px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}.panel-title{font-size:16px;font-weight:900}
.login-screen{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}.login-box{background:#fff;padding:30px;border-radius:20px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,0.3)}.login-box h2{margin:0 0 20px;font-weight:900;color:var(--navy);text-align:center}
.view-hidden{display:none!important}
.input{width:100%;border:1px solid #cbd5e1;border-radius:11px;background:#fff;padding:10px 11px;color:#111827;outline:none}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
.btn-primary{background:var(--navy);color:#fff}
</style>
</head>
<body>

<!-- GİRİŞ EKRANI -->
<div id="authContainer" class="login-screen">
  <div class="login-box">
    <h2>Gelir & Gider Giriş</h2>
    <div style="margin-bottom:15px;">
      <label style="display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:6px;">Kullanıcı Adı</label>
      <input type="text" id="loginUser" class="input" placeholder="Kullanıcı adınız">
    </div>
    <div style="margin-bottom:20px;">
      <label style="display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:6px;">Parola</label>
      <input type="password" id="loginPass" class="input" placeholder="••••••••">
    </div>
    <button onclick="handleLogin()" class="btn btn-primary" style="width:100%;">Giriş Yap</button>
    <p id="loginError" style="color:var(--danger); font-size:13px; text-align:center; margin-top:10px; font-weight:700;"></p>
  </div>
</div>

<!-- ANA UYGULAMA PANELİ -->
<div id="appContainer" class="app view-hidden">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand"><div class="brand-mark">₺</div> <span>Gelir & Gider Takip</span></div>
      <div class="status"><div class="status-dot"></div> <span id="usernameDisplay">Samed</span></div>
    </div>
  </div>
  <div class="main">
    <div class="toolbar">
      <div class="panel-title">Harcama Takip Paneline Başarıyla Giriş Yapıldı!</div>
    </div>
    <p style="font-weight:700; color:var(--muted);">Supabase bulut veritabanınız başarıyla bağlandı ve kullanıma hazır.</p>
  </div>
</div>

<script>
// Supabase Yapılandırması (Sizin Bilgileriniz Entegre Edildi)
const SUPABASE_URL = "https://supabase.co";
// Kopyaladığınız sb_publishable_F4JK93... ile başlayan şifreyi aşağıya tırnak içine yapıştırın
const SUPABASE_KEY = "sb_publishable_F4JK93h5B697yFPu1U-ppw_HAgFYMKZ"; 

async function handleLogin() {
  const user = document.getElementById("loginUser").value;
  const pass = document.getElementById("loginPass").value;
  const errorEl = document.getElementById("loginError");
  
  if (user === "Samed" && pass !== "") {
    errorEl.innerText = "Veritabanına bağlanılıyor...";
    
    try {
      // Test amaçlı harcamalar tablosundan veri çekmeyi deniyoruz
      const response = await fetch(`${SUPABASE_URL}/rest/v1/harcamalar?select=*`, {
        method: "GET",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      });
      
      if (response.ok) {
        errorEl.innerText = "";
        document.getElementById("authContainer").classList.add("view-hidden");
        document.getElementById("appContainer").classList.remove("view-hidden");
        document.getElementById("usernameDisplay").innerText = user;
      } else {
        errorEl.innerText = "Veritabanı bağlantı hatası. API anahtarını kontrol edin.";
      }
    } catch (e) {
      errorEl.innerText = "Sunucuya bağlanılamadı.";
    }
  } else {
    errorEl.innerText = "Kullanıcı adı veya şifre hatalı.";
  }
}
</script>
</body>
</html>
