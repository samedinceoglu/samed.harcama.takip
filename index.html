<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>💰 Harcama Takip Sistemi</h2>
      
      <!-- JSON Yedeği Yükleme Butonu -->
      <div>
        <label class="btn btn-warning text-dark font-weight-bold shadow-sm">
          📁 JSON Yedeği Yükle
          <input type="file" id="jsonFileInput" accept=".json" style="display: none;" onchange="handleJsonImport(event)">
        </label>
        <button class="btn btn-outline-danger btn-sm ms-2" onclick="verileriSifirla()" title="Yüklenen yerel verileri temizler">Temizle</button>
      </div>
    </div>

    <!-- Yeni Harcama Ekle Formu -->
    <div class="card p-3 mb-4 shadow-sm">
      <h5>Yeni Harcama Ekle</h5>
      <form id="harcamaForm" onsubmit="formGonder(event)">
        <div class="row g-2">
          <div class="col-md-3">
            <input type="date" id="date" class="form-control" required>
          </div>
          <div class="col-md-3">
            <input type="text" id="description" class="form-control" placeholder="Açıklama" required>
          </div>
          <div class="col-md-2">
            <input type="text" id="category" class="form-control" placeholder="Kategori" required>
          </div>
          <div class="col-md-2">
            <input type="number" step="0.01" id="credit" class="form-control" placeholder="Kredi Kartı (TL)">
          </div>
          <div class="col-md-2">
            <input type="number" step="0.01" id="cash" class="form-control" placeholder="Nakit (TL)">
          </div>
        </div>
        <button type="submit" class="btn btn-primary mt-3 w-100">Kaydet</button>
      </form>
    </div>

    <!-- Harcama Geçmişi Tablosu -->
    <div class="card p-3 shadow-sm">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="mb-0">Harcama Geçmişi</h5>
        <span id="kayitSayisi" class="badge bg-primary">0 Kayıt</span>
      </div>
      <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
        <table class="table table-hover mt-2 align-middle">
          <thead class="table-dark sticky-top">
            <tr>
              <th>Tarih</th>
              <th>Açıklama</th>
              <th>Kategori</th>
              <th>Kredi Kartı</th>
              <th>Nakit</th>
            </tr>
          </thead>
          <tbody id="harcamaListesi">
            <tr><td colspan="5" class="text-center">Yükleniyor...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Tabloyu Ekrana Basan Fonksiyon
    function tabloyuCiz(data) {
      if (!data || data.length === 0) {
        document.getElementById('harcamaListesi').innerHTML = '<tr><td colspan="5" class="text-center text-muted">Henüz harcama kaydı yok. "JSON Yedeği Yükle" butonundan yedek dosyanızı yükleyebilirsiniz.</td></tr>';
        document.getElementById('kayitSayisi').innerText = '0 Kayıt';
        return;
      }

      document.getElementById('kayitSayisi').innerText = `${data.length} Kayıt`;

      let html = '';
      data.forEach(item => {
        const creditVal = typeof item.credit === 'number' ? item.credit : parseFloat(item.credit) || 0;
        const cashVal = typeof item.cash === 'number' ? item.cash : parseFloat(item.cash) || 0;

        html += `<tr>
          <td>${item.date || '-'}</td>
          <td>${item.description || '-'}</td>
          <td><span class="badge bg-secondary">${item.category || 'Genel'}</span></td>
          <td class="${creditVal > 0 ? 'text-danger font-monospace fw-bold' : 'text-muted'}">${creditVal > 0 ? creditVal.toLocaleString('tr-TR', {minimumFractionDigits: 2}) + ' TL' : '-'}</td>
          <td class="${cashVal > 0 ? 'text-success font-monospace fw-bold' : 'text-muted'}">${cashVal > 0 ? cashVal.toLocaleString('tr-TR', {minimumFractionDigits: 2}) + ' TL' : '-'}</td>
        </tr>`;
      });
      document.getElementById('harcamaListesi').innerHTML = html;
    }

    // Verileri Yükleme Fonksiyonu (LocalStorage -> Google Apps Script)
    function verileriYukle() {
      const localData = localStorage.getItem('expenses_backup');
      
      if (localData) {
        try {
          const parsedData = JSON.parse(localData);
          tabloyuCiz(parsedData);
          return;
        } catch(e) {
          console.error("Yerel veri okunurken hata:", e);
        }
      }

      // Google Apps Script ortamındaysa
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler(function(data) {
          tabloyuCiz(data);
        }).getVeriler();
      } else {
        tabloyuCiz([]);
      }
    }

    // JSON Yedeğini Okuma ve Hafızaya Kaydetme Fonksiyonu
    function handleJsonImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const jsonData = JSON.parse(e.target.result);
          const records = jsonData.records || jsonData;

          if (Array.isArray(records)) {
            localStorage.setItem('expenses_backup', JSON.stringify(records));
            alert(`🎉 Başarılı! Toplam ${records.length} adet harcama kaydı yüklendi.`);
            verileriYukle();
          } else {
            alert("Geçersiz JSON formatı. Lütfen doğru yedek dosyasını seçin.");
          }
        } catch (err) {
          alert("Dosya okunurken bir hata oluştu: " + err.message);
        }
      };
      reader.readAsText(file);
    }

    // Yeni Harcama Ekleme
    function formGonder(e) {
      e.preventDefault();
      const payload = {
        date: document.getElementById('date').value,
        description: document.getElementById('description').value,
        category: document.getElementById('category').value,
        credit: parseFloat(document.getElementById('credit').value) || 0,
        cash: parseFloat(document.getElementById('cash').value) || 0
      };

      const localData = localStorage.getItem('expenses_backup');
      let records = localData ? JSON.parse(localData) : [];
      records.unshift(payload); // En üste ekle
      localStorage.setItem('expenses_backup', JSON.stringify(records));

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.harcamaEkle(payload);
      }

      document.getElementById('harcamaForm').reset();
      verileriYukle();
    }

    // Yerel Verileri Temizleme Butonu
    function verileriSifirla() {
      if (confirm("Yüklenen yerel harcama verilerini temizlemek istediğinize emin misiniz?")) {
        localStorage.removeItem('expenses_backup');
        verileriYukle();
      }
    }

    window.onload = verileriYukle;
  </script>
</body>
</html>
