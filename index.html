<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container">
    <h2 class="mb-4">💰 Harcama Takip Sistemi</h2>
    <div class="card p-3 mb-4 shadow-sm">
      <h5>Yeni Harcama Ekle</h5>
      <form id="harcamaForm" onsubmit="formGonder(event)">
        <div class="row g-2">
          <div class="col-md-3">
            <input type="date" id="date" class="form-control" required>
          </div>
          <div class="col-md-3">
            <input type="text" id="description" class="form-control" placeholder="Açıklama" required>
          </div>
          <div class="col-md-2">
            <input type="text" id="category" class="form-control" placeholder="Kategori" required>
          </div>
          <div class="col-md-2">
            <input type="number" step="0.01" id="credit" class="form-control" placeholder="Kredi Kartı (TL)">
          </div>
          <div class="col-md-2">
            <input type="number" step="0.01" id="cash" class="form-control" placeholder="Nakit (TL)">
          </div>
        </div>
        <button type="submit" class="btn btn-primary mt-3 w-100">Kaydet</button>
      </form>
    </div>

    <div class="card p-3 shadow-sm">
      <h5>Harcama Geçmişi</h5>
      <div class="table-responsive">
        <table class="table table-hover mt-2">
          <thead>
            <tr>
              <th>Tarih</th>
              <th>Açıklama</th>
              <th>Kategori</th>
              <th>Kredi Kartı</th>
              <th>Nakit</th>
            </tr>
          </thead>
          <tbody id="harcamaListesi">
            <tr><td colspan="5" class="text-center">Yükleniyor...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function verileriYukle() {
      google.script.run.withSuccessHandler(function(data) {
        let html = '';
        data.forEach(item => {
          html += `<tr>
            <td>${item.date}</td>
            <td>${item.description}</td>
            <td><span class="badge bg-secondary">${item.category}</span></td>
            <td>${item.credit ? item.credit + ' TL' : '-'}</td>
            <td>${item.cash ? item.cash + ' TL' : '-'}</td>
          </tr>`;
        });
        document.getElementById('harcamaListesi').innerHTML = html;
      }).getVeriler();
    }

    function formGonder(e) {
      e.preventDefault();
      const payload = {
        date: document.getElementById('date').value,
        description: document.getElementById('description').value,
        category: document.getElementById('category').value,
        credit: parseFloat(document.getElementById('credit').value) || 0,
        cash: parseFloat(document.getElementById('cash').value) || 0
      };
      google.script.run.withSuccessHandler(function() {
        document.getElementById('harcamaForm').reset();
        verileriYukle();
      }).harcamaEkle(payload);
    }

    window.onload = verileriYukle;
  </script>
</body>
</html>
